<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add 2 Large Numbers</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="card-title mb-4">
                        Add 2 Large Numbers
                    </h2>

                    <form id="addForm">

                        <div class="mb-3">

                            <label for="stn1"
                                   class="form-label">
                                Number 1
                            </label>

                            <textarea
                                    id="stn1"
                                    class="form-control"
                                    rows="4"
                                    required></textarea>

                        </div>

                        <div class="mb-3">

                            <label for="stn2"
                                   class="form-label">
                                Number 2
                            </label>

                            <textarea
                                    id="stn2"
                                    class="form-control"
                                    rows="4"
                                    required></textarea>

                        </div>

                        <button
                                type="submit"
                                id="calculateButton"
                                class="btn btn-primary">

                            Calculate

                        </button>

                    </form>

                    <hr class="my-4">

                    <div id="progressSection"
                         style="display: none;">

                        <div class="d-flex justify-content-between">

                            <span>
                                Progress
                            </span>

                            <span id="progressText">
                                0%
                            </span>

                        </div>

                        <div class="progress mt-2">

                            <div
                                    id="progressBar"
                                    class="progress-bar progress-bar-striped progress-bar-animated"
                                    role="progressbar"
                                    style="width: 0%">

                                0%

                            </div>

                        </div>

                        <div
                                id="statusText"
                                class="text-muted mt-2">

                            Processing...

                        </div>

                    </div>

                    <div id="resultSection"
                         class="mt-4"
                         style="display: none;">

                        <h5>Result</h5>

                        <div
                                id="resultText"
                                class="alert alert-success"
                                style="word-break: break-all;">
                        </div>

                    </div>

                    <div id="errorSection"
                         class="mt-4"
                         style="display: none;">

                        <div
                                id="errorText"
                                class="alert alert-danger">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    const form =
        document.getElementById("addForm");

    const button =
        document.getElementById("calculateButton");

    const progressSection =
        document.getElementById("progressSection");

    const progressBar =
        document.getElementById("progressBar");

    const progressText =
        document.getElementById("progressText");

    const statusText =
        document.getElementById("statusText");

    const resultSection =
        document.getElementById("resultSection");

    const resultText =
        document.getElementById("resultText");

    const errorSection =
        document.getElementById("errorSection");

    const errorText =
        document.getElementById("errorText");


    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const stn1 =
            document.getElementById("stn1").value.trim();

        const stn2 =
            document.getElementById("stn2").value.trim();

        resetUI();

        button.disabled = true;

        progressSection.style.display = "block";

        statusText.textContent =
            "Starting calculation...";


        const body =
            new URLSearchParams();

        body.append("stn1", stn1);
        body.append("stn2", stn2);


        try {

            const response =
                await fetch("/api/add", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: body
                });


            if (!response.ok) {
                throw new Error(
                    "Failed to start calculation."
                );
            }


            const data =
                await response.json();

            const jobId =
                data.jobId;


            listenProgress(jobId);

        } catch (error) {

            showError(error.message);

            button.disabled = false;
        }
    });


    function listenProgress(jobId) {

    const eventSource =
        new EventSource(
            "/api/progress/" + jobId
        );

    eventSource.addEventListener(
        "progress",
        function (event) {

            const progress =
                Number(event.data);

            progressBar.style.width =
                progress + "%";

            progressBar.textContent =
                progress + "%";

            progressText.textContent =
                progress + "%";

            statusText.textContent =
                "Processing... " +
                progress +
                "%";
        }
    );

    eventSource.addEventListener(
        "result",
        function (event) {

            progressBar.style.width =
                "100%";

            progressBar.textContent =
                "100%";

            progressText.textContent =
                "100%";

            statusText.textContent =
                "Completed";

            resultText.textContent =
                event.data;

            resultSection.style.display =
                "block";

            button.disabled = false;

            eventSource.close();
        }
    );

    eventSource.addEventListener(
        "error",
        function (event) {

            if (event.data) {

                showError(event.data);
            }

            button.disabled = false;

            eventSource.close();
        }
    );
}


    function resetUI() {

        progressBar.style.width =
            "0%";

        progressBar.textContent =
            "0%";

        progressText.textContent =
            "0%";

        statusText.textContent =
            "";

        resultSection.style.display =
            "none";

        errorSection.style.display =
            "none";
    }


    function showError(message) {

        errorText.textContent =
            message;

        errorSection.style.display =
            "block";

        progressSection.style.display =
            "none";
    }

</script>

</body>

</html>
